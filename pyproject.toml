[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "simpy-ts"
version = "0.1.0"
description = "SimPy.ts (Simpatel Python TypeScript): framework web Python + TypeScript."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Simpatel Studios" }]
keywords = ["web", "framework", "python", "typescript", "asgi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: JavaScript",
  "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
]
# Validasi input memakai modul bawaan (simpy.validation), bukan Pydantic,
# supaya bisa di-install di Termux/Android tanpa toolchain Rust.
dependencies = ["anyio>=4", "starlette>=0.37", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
simpy = "simpy_cli.main:main"

[tool.setuptools]
package-dir = { "simpy" = "src/simpy", "simpy_cli" = "cli/simpy_cli", "simpy_frontend" = "src/frontend" }
packages = ["simpy", "simpy_cli", "simpy_frontend"]

[tool.setuptools.package-data]
simpy_cli = ["templates/**/*"]
simpy_frontend = ["*.ts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "cli"]

[tool.ruff]
line-length = 100
target-version = "py311"
